<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión</title>
<style>
  body{margin:0;min-height:100vh;background:#fff1f6;font-family:"Segoe UI",system-ui,sans-serif;color:#4a3f5c;
       display:flex;justify-content:center;padding:60px 16px}
  .contenedor{width:100%;max-width:480px}
  h1{margin:0 0 6px;color:#5a4a78;font-size:2rem}
  h2{margin:0 0 18px;color:#2b2f8f;font-size:1.25rem}
  .caja{background:#fff;border:2px solid #e3d3ee;border-radius:22px;padding:28px}
  .tabs{display:flex;gap:8px;margin-bottom:18px}
  .tab{flex:1;padding:10px;border-radius:14px;border:2px solid #e3d3ee;background:#fff;color:#4a3f5c;
       text-align:center;text-decoration:none}
  .tab.activo{background:#e6d9f2;font-weight:700}
  label{display:block;margin:14px 0 4px;font-size:.92rem}
  input,select{width:100%;box-sizing:border-box;padding:11px 14px;border:2px solid #e3d3ee;border-radius:14px;
        font:inherit;color:#4a3f5c;background:#fffafd}
  input:focus-visible,select:focus-visible,button:focus-visible,.tab:focus-visible{outline:3px solid #9b8bd4;outline-offset:2px}
  button{margin-top:20px;padding:12px 22px;border:0;border-radius:14px;background:#c9b6ea;
         color:#3b2f57;font:inherit;font-weight:700;cursor:pointer}
  button:hover{background:#bba6e2}
  #mensaje{min-height:1.3em;margin:12px 0 0;font-size:.9rem;color:#a23a5b}
  #mensaje.ok{color:#2f7a55}
  .nota{font-size:.85rem;margin:10px 0 0}
  #cajaCodigo{display:none}
</style>
</head>
<body>
<div class="contenedor">
  <h1>🌸 Embarazo adolescente</h1>
  <h2>Información clara y sin juicios</h2>
  <div class="caja">
    <div class="tabs">
      <a class="tab activo" href="iniciarsesion.html">Iniciar sesión</a>
      <a class="tab" href="registro.html">Crear cuenta</a>
    </div>

    <label for="usuario">Usuario</label>
    <input id="usuario" autocomplete="username">

    <label for="clave">Contraseña</label>
    <input id="clave" type="password" autocomplete="current-password">

    <button id="btnEntrar">Entrar</button>
    <p id="mensaje" role="alert"></p>
  </div>
</div>

<script>
  // 1. A dónde manda a cada tipo de persona al entrar (cámbialo cuando tengas tus bienvenidas)
  const DESTINO = {
    admin:   "administradores/bienvenidaadmin.html",
    usuario: "usuarios/bienvenidausuario.html"
  };

  // 2. Leer la lista de usuarios guardada (la llena la página de registro)
  let lista = JSON.parse(localStorage.getItem("tp_usuarios")) || [];

  // 3. Si no hay nadie, crear un admin de prueba para poder entrar
  if (lista.length === 0) {
    lista.push({ usuario: "admin", correo: "", clave: "admin123", rol: "admin", fecha: new Date().toISOString() });
    localStorage.setItem("tp_usuarios", JSON.stringify(lista));
  }

  // 4. Qué pasa al hacer clic en "Entrar"
  function entrar() {
    const usuario = document.getElementById("usuario").value.trim();
    const clave = document.getElementById("clave").value;
    const mensaje = document.getElementById("mensaje");

    const encontrado = lista.find(function (u) {
      return u.usuario.toLowerCase() === usuario.toLowerCase() && u.clave === clave;
    });

    if (!encontrado) {
      mensaje.textContent = "Usuario o contraseña incorrectos.";
      return;
    }

    // 5. Guardar quién entró y qué rol tiene, y mandarlo a su página
    localStorage.setItem("tp_sesion", JSON.stringify({ usuario: encontrado.usuario, rol: encontrado.rol }));
    window.location.href = DESTINO[encontrado.rol];
  }

  document.getElementById("btnEntrar").addEventListener("click", entrar);
  document.getElementById("clave").addEventListener("keydown", function (e) {
    if (e.key === "Enter") entrar();
  });
</script>
</body>
</html>
